<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bibliothèque Marina</title>
  <meta name="theme-color" content="#131315" />
  <meta name="description" content="Application personnelle de suivi de lectures Kindle et Books." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><small>MarinaBooks</small>Bibliothèque Marina</div>
      <nav id="sidebarNav"></nav>
      <div class="sidebar-bottom">
        <button id="syncBtnDesktop" class="ghost-btn" type="button">Synchronisation</button>
        <button id="addBookBtnDesktop" class="fab sidebar-fab" type="button">+ Ajouter un livre</button>
      </div>
    </aside>

    <div class="main">
      <div id="content"></div>
    </div>

    <button id="addBookBtn" class="fab mobile-only" type="button" aria-label="Ajouter un livre">+</button>

    <nav class="tabbar" id="tabbar" aria-label="Navigation">
      <button data-view="home" type="button"><i></i>Accueil</button>
      <button data-view="library" type="button"><i></i>Bibliothèque</button>
      <button data-view="series" type="button"><i></i>Séries</button>
      <button data-view="authors" type="button"><i></i>Auteurs</button>
    </nav>
  </div>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-panel" id="detailPanel"></div>
  </div>

  <dialog id="bookDialog" class="dialog">
    <form id="bookForm" method="dialog">
      <div class="dialog-head">
        <h2>Ajouter un livre</h2>
        <button class="icon-btn" value="cancel" type="submit">×</button>
      </div>
      <label>Titre<input name="title" required /></label>
      <label>Auteur<input name="author" /></label>
      <label>Série<input name="series" /></label>
      <label>Tome<input name="tome" inputmode="numeric" /></label>
      <label>Année<input name="year" inputmode="numeric" /></label>
      <label>Statut<select name="status"><option value="lu">Lu</option><option value="en cours">En cours</option><option value="à lire">À lire</option><option value="abandonné">Abandonné</option></select></label>
      <label>Notes<textarea name="notes" rows="3"></textarea></label>
      <button class="primary-btn" value="default" type="submit">Ajouter</button>
    </form>
  </dialog>

  <dialog id="syncDialog" class="dialog">
    <form id="syncForm" method="dialog">
      <div class="dialog-head">
        <h2>Synchronisation GitHub</h2>
        <button class="icon-btn" value="cancel" type="submit">×</button>
      </div>
      <p id="syncStatusText" class="meta">Non connecté.</p>
      <label>Token d'accès personnel (PAT)<input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_…" /></label>
      <label>Dépôt (owner/repo)<input id="ghRepo" type="text" placeholder="marinahodebert/bibliotheque-marina" /></label>
      <label>Branche<input id="ghBranch" type="text" placeholder="refonte-v2" /></label>
      <p class="meta sync-warn">Branche de test — laisse « refonte-v2 » tant que la synchronisation n'est pas validée en production. Ne mets « main » qu'à la mise en production.</p>
      <div class="btn-row">
        <button id="ghSaveBtn" class="primary-btn" type="button">Enregistrer et tester</button>
        <button id="ghDisconnectBtn" class="ghost-btn" type="button">Déconnecter</button>
      </div>
      <p id="ghPendingText" class="meta"></p>
      <button id="ghSyncNowBtn" class="ghost-btn" type="button">Synchroniser maintenant</button>
      <hr style="border:none; border-top:1px solid var(--hair); margin:.3rem 0;" />
      <div class="btn-row">
        <button id="exportBtn" class="ghost-btn" type="button">Exporter (JSON)</button>
        <label class="ghost-btn import-label">Importer<input id="importInput" type="file" accept="application/json" /></label>
      </div>
    </form>
  </dialog>

  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
